<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/assets/extension-runtime/sidepanel/">
    <title>Ultimate Clipboard Pro Demo Manager</title>
    <script>
      (function prepareDemoLanguage() {
        window.addEventListener("error", (event) => {
          document.documentElement.dataset.demoRuntimeError = String(event.error?.stack || event.message || "unknown");
        });
        window.addEventListener("unhandledrejection", (event) => {
          document.documentElement.dataset.demoRuntimeError = String(event.reason?.stack || event.reason || "unknown");
        });
        const supported = ["en", "fr", "es", "it", "de", "ro", "pt", "ar", "zh", "ja", "ru", "nl", "pl", "tr", "ko", "hi"];
        const requested = new URLSearchParams(location.search).get("lang") || "en";
        const language = supported.includes(requested) ? requested : "en";
        window.__UCP_DEMO_LANGUAGE__ = language;
        document.documentElement.lang = language;
        document.documentElement.dir = "ltr";
        document.documentElement.style.direction = "ltr";
        if (language !== "en") document.write(`<script src="/assets/extension-runtime/demo-locales/${language}.js?v=20260822-demo-fast-pro"><\/script>`);
      })();
    </script>
    <script src="../demo-runtime.js?v=20260822-demo-fast-pro"></script>
    <script>
      (function installDemoManagerBridge() {
        const params = new URLSearchParams(location.search);
        const lang = window.__UCP_DEMO_LANGUAGE__ || params.get("lang") || "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = "ltr";
        const bridge = window.UCP_DEMO_RUNTIME.makeStateBridge(lang, {
          closeManager: () => parent.postMessage({ type: "UCP_DEMO_CLOSE_MANAGER" }, location.origin),
          showBlocked: () => parent.postMessage({ type: "UCP_DEMO_BLOCKED" }, location.origin),
          openTools: () => parent.postMessage({ type: "UCP_DEMO_BLOCKED" }, location.origin)
        });
        bridge.installChromeMock();
        window.__UCP_DEMO_BRIDGE__ = bridge;
        window.__UCP_DEMO_FORCE_PRO__ = true;
        window.close = () => parent.postMessage({ type: "UCP_DEMO_CLOSE_MANAGER" }, location.origin);
      })();
    </script>
    <script src="../shared/themeBoot.js"></script>
    <link rel="stylesheet" href="sidepanel.css?v=20260822-runtime-sync">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        direction: ltr;
        text-align: left;
      }

      html[lang="ar"] body,
      html[lang="ar"] input,
      html[lang="ar"] textarea,
      html[lang="ar"] select,
      html[lang="ar"] .item-card,
      html[lang="ar"] .item-title,
      html[lang="ar"] .item-content,
      html[lang="ar"] .item-meta,
      html[lang="ar"] .category-row {
        text-align: left !important;
      }

      html[lang="ar"] .item-title,
      html[lang="ar"] .item-content,
      html[lang="ar"] .item-meta,
      html[lang="ar"] input,
      html[lang="ar"] textarea {
        direction: rtl !important;
        unicode-bidi: plaintext !important;
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <span class="topbar-app-icon-wrap">
            <img class="topbar-app-icon" src="../assets/icons/icon128.png" alt="" aria-hidden="true">
            <span class="brand-pro-badge is-manager-badge" data-role="brand-pro-badge" hidden aria-hidden="true">
              <img src="../assets/icons/pro-icon.png?v=20260807-disc" alt="">
            </span>
          </span>
          <div class="topbar-copy">
            <h1>Ultimate Clipboard Pro</h1>
            <p>Advanced clipboard workspace for demanding users.</p>
          </div>
        </div>
        <section class="media-tabs" role="tablist">
          <button id="textTab" type="button" class="is-active" aria-label="Texts" title="Texts">
            <img class="tab-icon" src="../assets/icons/text_icon.png" alt="" aria-hidden="true">
            <span class="sr-only media-tab-label">Texts</span>
          </button>
          <button id="devTab" type="button" aria-label="Codes" title="Codes">
            <img class="tab-icon" src="../assets/icons/dev.png" alt="" aria-hidden="true">
            <span class="sr-only media-tab-label">Codes</span>
          </button>
          <button id="imageTab" type="button" aria-label="Images" title="Images">
            <img class="tab-icon" src="../assets/icons/images_icon.png" alt="" aria-hidden="true">
            <span class="sr-only media-tab-label">Images</span>
          </button>
        </section>
        <div class="topbar-actions">
          <button id="openSourceTimeline" class="icon-button manager-timeline-button" type="button" aria-label="Source history" title="Source history">
            <img src="../assets/icons/historic-timeline.png" alt="" aria-hidden="true">
          </button>
          <button id="openTools" class="icon-button manager-tools-button" type="button" aria-label="Tools" title="Tools">
            <img src="../assets/icons/tootls.png" alt="" aria-hidden="true">
          </button>
          <button id="openManagerMenu" class="manager-menu-button" type="button" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-expanded="false">
            <svg class="menu-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 7h14M5 12h14M5 17h14"></path>
            </svg>
          </button>
          <button id="closeManager" class="icon-button close-manager" type="button" aria-label="Close">&times;</button>
        </div>
      </header>

      <section class="manager-card">
        <section class="manager-layout">
          <aside class="category-pane">
            <div class="category-pane-head">
              <strong id="categoryPaneTitle">Categories</strong>
              <div class="category-pane-tools">
                <input id="categoryTreeSearch" type="search" aria-label="Search category">
                <button id="newCategory" class="square-plus-button" type="button">+</button>
              </div>
            </div>
            <nav id="categoryList" class="category-list" aria-label="Categories"></nav>
            <div id="managerDriveQuickSync" class="manager-drive-quick-sync-host"></div>
          </aside>

          <section class="content-pane" id="managerContentPane">
            <div class="content-pane-flipper">
            <section class="content-pane-face content-pane-front" aria-label="Capture management" aria-hidden="false">
            <div class="content-pane-head">
              <div id="currentViewTitleSlot" class="current-view-title-slot"></div>
              <section id="imageViewModes" class="view-modes" hidden aria-label="Image display">
                <button type="button" data-view-mode="small">Small</button>
                <button type="button" data-view-mode="medium" class="is-active">Medium</button>
                <button type="button" data-view-mode="large">Large</button>
              </section>
              <section id="textViewModes" class="view-modes" hidden aria-label="Text and code display">
                <button type="button" data-text-view-mode="card" class="is-active">Cards</button>
                <button type="button" data-text-view-mode="list">List</button>
              </section>
              <section class="content-search-row" aria-label="Search">
                <input id="searchInput" type="search" placeholder="Search a text" aria-label="Search">
              </section>
            </div>
            <section id="statusBanner" class="status-banner" hidden></section>
            <section id="itemsList" class="items-list" aria-label="Copy history"></section>
            <button id="openCreateItemFloating" class="view-create-item-button floating-create-item-button" type="button" data-manager-action="create-current-item">+</button>
            <button id="openMontage" class="advanced-search-button floating-montage-button" type="button">
              <img class="floating-montage-icon" src="../assets/icons/montage-lightmod.png" alt="" aria-hidden="true">
              <span data-role="montage-button-label">Montage</span>
            </button>
            </section>
            <section id="managerMontageWorkspace" class="content-pane-face content-pane-back manager-montage-workspace" aria-hidden="true" inert>
              <header class="manager-montage-workspace-head">
                <div><strong data-role="montage-title">Text montage</strong><p data-role="montage-subtitle"></p></div>
                <button type="button" class="manager-montage-workspace-close" data-manager-action="close-montage" aria-label="Close">&times;</button>
              </header>
              <div class="manager-montage-layout">
                <aside class="manager-montage-source">
                  <div class="manager-montage-section-head"><strong data-role="montage-available"></strong><span data-role="montage-source-count"></span></div>
                  <div id="managerMontageAvailable" class="manager-montage-list"></div>
                </aside>
                <section class="manager-montage-chain">
                  <div class="manager-montage-section-head"><strong data-role="montage-chain"></strong><span data-role="montage-count"></span></div>
                  <div class="manager-montage-tools"><label><span data-role="montage-format-label"></span><select id="managerMontageFormat"><option value="plain"></option><option value="numbered"></option><option value="bullets"></option><option value="sections"></option><option value="markdown"></option><option value="spaced"></option></select></label><button type="button" data-manager-action="open-montage-final-editor"></button></div>
                  <div id="managerMontageChain" class="manager-montage-list is-chain"></div>
                  <footer><button type="button" data-manager-action="clear-montage"></button><button type="button" data-manager-action="classify-montage"></button><button type="button" class="primary" data-manager-action="copy-montage"></button></footer>
                </section>
              </div>
            </section>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="../shared/surfaceBoot.js" data-surface="manager"></script>
    <script>
      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        if (event.data?.type === "UCP_DEMO_SELECT_TAB") {
          const tab = event.data.mediaType;
          const button = tab === "image" ? document.getElementById("imageTab") : tab === "dev" ? document.getElementById("devTab") : document.getElementById("textTab");
          button?.click();
        }
        if (event.data?.type === "UCP_DEMO_OPEN_TOOLS") document.getElementById("openTools")?.click();
      });
      window.addEventListener("load", () => {
        const tab = new URLSearchParams(location.search).get("tab");
        const button = tab === "image" ? document.getElementById("imageTab") : tab === "dev" ? document.getElementById("devTab") : document.getElementById("textTab");
        window.setTimeout(() => button?.click(), 120);
      });
    </script>
  </body>
</html>
